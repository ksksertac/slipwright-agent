# Packaging for the three platforms. Icons are derived from build/icon.png (512 px).
#
# The file names carry no version: a release (.github/workflows/docker.yml) attaches them,
# and a name that never changes is what lets a link to .../releases/latest/download/<name>
# always fetch the newest one -- the Machines page links to them that way.
appId: app.slipwright.agent
productName: Slipwright Agent
# where a running app looks for a newer one (src/main/updates.ts); CI uploads latest*.yml
publish:
  provider: github
  owner: ksksertac
  repo: slipwright-agent
  releaseType: release
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  artifactName: Slipwright-Agent-mac-${arch}.${ext}
  # Ad-hoc signed ("-"): no Developer ID, but one signature over the whole bundle. Left
  # unsigned, electron-builder's changes to the bundle broke the signature Electron ships
  # with, and Gatekeeper called a downloaded copy "damaged" rather than "unidentified
  # developer". Hardened runtime is off because an ad-hoc signature has no team for its
  # library validation to match. A Developer ID and notarization replace both (README).
  identity: "-"
  hardenedRuntime: false
  notarize: false
win:
  target: [nsis]
nsis:
  artifactName: Slipwright-Agent-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
  # a .deb refuses to be built without an address for its maintainer
  maintainer: Slipwright <noreply@slipwright.app>
appImage:
  artifactName: Slipwright-Agent.${ext}
deb:
  artifactName: slipwright-agent.${ext}
